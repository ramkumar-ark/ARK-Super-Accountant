spring.application.name=superaccountant

# PostgreSQL Configuration
# DB_PASSWORD must be set as an environment variable. The application will not start without it.
# DB_URL and DB_USERNAME fall back to the local development database; override them outside localhost.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/superaccountant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# JWT_SECRET must be set as an environment variable (min 32 characters). Application will not start without it.
arktech.app.jwtExpirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Phase 2 migration: before deploying role restructuring, apply db/migration/V2__role_restructuring.sql
# psql -h localhost -U <user> -d superaccountant -f src/main/resources/db/migration/V2__role_restructuring.sql
