name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Service/superaccountant
    services:
      # Backs contextLoads (SuperaccountantApplicationTests), which connects to localhost:5432.
      # Credentials are throwaway values for this ephemeral CI database only.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: superaccountant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values; the application refuses to start without them.
      DB_PASSWORD: ci-only-db-password
      JWT_SECRET: ci-only-jwt-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Service/superaccountant/pom.xml

      # Unit tests (surefire) and *IT Testcontainers tests (failsafe, bound to verify).
      # GitHub-hosted ubuntu runners provide Docker for Testcontainers.
      - name: Run unit and integration tests
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
